name: Phase 1 CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore AllInsurance.slnx
      - name: Build
        run: dotnet build AllInsurance.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/AllInsurance.Tests/AllInsurance.Tests.csproj --configuration Release --no-build --no-restore

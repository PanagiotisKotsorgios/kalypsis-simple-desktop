name: Desktop release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build complete Windows application
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet build src/AllInsurance.Desktop/AllInsurance.Desktop.csproj -c Release -r win-x64 --self-contained true -p:Version=$version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $output = 'src\AllInsurance.Desktop\bin\Release\net10.0-windows10.0.19041.0\win-x64'
          if (-not (Test-Path "$output\KalypsisSimple.Desktop.pri") -or -not (Test-Path "$output\App.xbf")) {
            throw 'Required WinUI resources are missing.'
          }
      - name: Package backward-compatible application update
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $app = 'src\AllInsurance.Desktop\bin\Release\net10.0-windows10.0.19041.0\win-x64'
          $appRoot = (Resolve-Path $app).Path.TrimEnd('\', '/') + '\'
          $files = Get-ChildItem -LiteralPath $app -Recurse -File
          foreach ($file in $files) {
            $relative = $file.FullName.Substring($appRoot.Length).Replace('\', '/')
            $parts = $relative.Split('/')
            if ($parts | Where-Object { $_ -in @('Data', 'Backups', 'RecordFiles') }) {
              throw "Update package contains a user-data directory: $relative"
            }
            if ([IO.Path]::GetExtension($relative) -in @('.db', '.sqlite')) {
              throw "Update package contains a database file: $relative"
            }
          }
          $archive = Join-Path $env:RUNNER_TEMP 'kalypsis-simple-desktop-win-x64.zip'
          Compress-Archive -Path "$app\*" -DestinationPath $archive -CompressionLevel Optimal
          $zip = [IO.Compression.ZipFile]::OpenRead($archive)
          try {
            if (-not $zip.GetEntry('KalypsisSimple.Desktop.exe')) {
              throw 'Update package is missing KalypsisSimple.Desktop.exe.'
            }
            if ($zip.Entries | Where-Object {
              $_.FullName.Split('/') | Where-Object { $_ -in @('Data', 'Backups', 'RecordFiles') }
            }) { throw 'Update package has a path rejected by older clients.' }
          } finally { $zip.Dispose() }
      - name: Build signed installer when signing credentials are configured
        shell: pwsh
        env:
          INNO_LICENSE_KEY: ${{ secrets.INNO_LICENSE_KEY }}
          CODE_SIGNING_PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
          CODE_SIGNING_PFX_PASSWORD: ${{ secrets.CODE_SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:INNO_LICENSE_KEY -or -not $env:CODE_SIGNING_PFX_BASE64 -or
              -not $env:CODE_SIGNING_PFX_PASSWORD) {
            Write-Warning 'Installer signing credentials are unavailable; publishing the update ZIP only.'
            return
          }
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $licensePath = 'HKCU:\Software\Jordan Russell\Inno Setup\License'
          New-Item -Path $licensePath -Force | Out-Null
          New-ItemProperty -Path $licensePath -Name LicenseKey -PropertyType String `
            -Value $env:INNO_LICENSE_KEY -Force | Out-Null
          $pfx = Join-Path $env:RUNNER_TEMP 'release-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODE_SIGNING_PFX_BASE64))
          try {
            $password = ConvertTo-SecureString $env:CODE_SIGNING_PFX_PASSWORD -AsPlainText -Force
            $imported = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            $certificate = $imported | Where-Object HasPrivateKey | Select-Object -First 1
            if (-not $certificate) { throw 'The signing certificate has no private key.' }
            $signTool = Get-ChildItem -LiteralPath "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -File |
              Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signTool) { throw 'Windows SDK SignTool was not found.' }
            $iscc = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
            if (-not $iscc) { throw 'Inno Setup compiler was not found.' }
            $version = '${{ github.ref_name }}'.TrimStart('v')
            $app = 'src\AllInsurance.Desktop\bin\Release\net10.0-windows10.0.19041.0\win-x64'
            & ./scripts/build-installer.ps1 -Version $version -PublishDir $app `
              -OutputDir $env:RUNNER_TEMP -IsccPath $iscc -SignToolPath $signTool.FullName `
              -CertificateThumbprint $certificate.Thumbprint
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
            if ($certificate) { Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -Force -ErrorAction SilentlyContinue }
          }
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $assets = @(
            "$env:RUNNER_TEMP\kalypsis-simple-desktop-win-x64.zip"
          )
          $installer = "$env:RUNNER_TEMP\Kalypsis-Simple-Setup-$($tag.TrimStart('v'))-win-x64.exe"
          if (Test-Path -LiteralPath $installer) { $assets += $installer }
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --repo '${{ github.repository }}' --clobber
          } else {
            gh release create $tag @assets --repo '${{ github.repository }}' --verify-tag --generate-notes --latest
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
